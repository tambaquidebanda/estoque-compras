<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Recebimento — Tambaqui de Banda</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a1f2e;
      --card:    #242938;
      --borda:   #2e3548;
      --verde:   #2EC4B6;
      --laranja: #FF6B35;
      --txt:     #e8eaf0;
      --txt2:    #8892a4;
      --danger:  #e74c3c;
      --warn:    #f39c12;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
    }

    /* ── TELAS ── */
    #tela-login,
    #tela-lista,
    #tela-pedido { display: none; flex-direction: column; min-height: 100dvh; }
    #tela-login { align-items: center; justify-content: center; padding: 1.5rem; }

    /* ── LOGIN ── */
    .login-card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 380px;
    }
    .login-logo { text-align: center; margin-bottom: 1.5rem; }
    .login-logo img { max-width: 160px; }
    .login-logo h2 { font-size: 1.1rem; color: var(--txt2); margin-top: .5rem; }
    .login-label { display: block; font-size: .8rem; color: var(--txt2); margin-bottom: .4rem; font-weight: 500; }
    input[type=email], input[type=password] {
      width: 100%; background: var(--bg); border: 1px solid var(--borda);
      border-radius: 10px; color: var(--txt); font-size: 1rem;
      padding: .75rem 1rem; margin-bottom: 1rem; outline: none; -webkit-appearance: none;
    }
    input[type=email]:focus, input[type=password]:focus { border-color: var(--verde); }
    .btn-entrar {
      width: 100%; background: var(--verde); color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600; padding: .85rem; cursor: pointer;
    }
    .btn-entrar:disabled { opacity: .5; }
    .login-erro { color: #ff6b6b; font-size: .85rem; margin-top: .5rem; text-align: center; }

    /* ── CABEÇALHO ── */
    .cabecalho {
      background: var(--card);
      border-bottom: 1px solid var(--borda);
      padding: .75rem 1rem;
      position: sticky; top: 0; z-index: 50;
    }
    .cab-row { display: flex; align-items: center; gap: .75rem; }
    .cab-row img { height: 32px; }
    .cab-row h1 { font-size: 1rem; font-weight: 700; flex: 1; }
    .btn-sair { background: none; border: 1px solid var(--borda); color: var(--txt2); border-radius: 8px; padding: .3rem .7rem; font-size: .8rem; cursor: pointer; }
    .btn-voltar { background: none; border: none; color: var(--verde); font-size: .9rem; font-weight: 600; cursor: pointer; padding: 0; }

    /* ── LISTA ── */
    .lista-body { padding: 1rem; padding-bottom: 5rem; flex: 1; }
    .lista-vazia { text-align: center; color: var(--txt2); padding: 3rem 1rem; }
    .lista-vazia .ico { font-size: 2.5rem; margin-bottom: .75rem; }

    .pedido-card {
      background: var(--card); border: 1px solid var(--borda);
      border-radius: 12px; padding: 1rem; margin-bottom: .75rem; cursor: pointer;
    }
    .pedido-card:active { border-color: var(--verde); }
    .pc-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .3rem; }
    .pc-num  { font-size: 1.05rem; font-weight: 700; color: var(--laranja); }
    .pc-tot  { font-size: .95rem; font-weight: 700; color: var(--verde); }
    .pc-forn { font-size: .88rem; font-weight: 600; margin-bottom: .2rem; }
    .pc-info { font-size: .74rem; color: var(--txt2); display: flex; gap: .75rem; flex-wrap: wrap; }

    /* ── FORMULÁRIO DE RECEBIMENTO ── */
    .campos-bloco {
      background: var(--card); border-bottom: 1px solid var(--borda);
      padding: .75rem 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
    }
    .campo-full { grid-column: 1 / -1; }
    .campo-lbl { display: block; font-size: .72rem; color: var(--txt2); margin-bottom: .3rem; font-weight: 500; }
    input[type=date], input[type=text] {
      width: 100%; background: var(--bg); border: 1px solid var(--borda);
      border-radius: 8px; color: var(--txt); font-size: .88rem;
      padding: .55rem .75rem; outline: none; -webkit-appearance: none;
    }
    input[type=date]:focus, input[type=text]:focus { border-color: var(--verde); }

    /* ── ITENS ── */
    .itens-corpo { padding: .75rem 1rem 7rem; flex: 1; }
    .item-card {
      background: var(--card); border: 1px solid var(--borda);
      border-radius: 10px; padding: .75rem; margin-bottom: .6rem;
      transition: opacity .2s;
    }
    .item-card.diverg   { border-color: var(--warn); }
    .item-card.conferido { border-color: #22c55e; background: #12301f; }
    .item-card.conferido input:disabled { opacity: .75; }
    .conf-status { font-size: .72rem; margin-top: .3rem; font-weight: 600; }
    .conf-status.ok   { color: #4ade80; }
    .conf-status.esp  { color: var(--txt2); }
    .conf-status.aviso { color: var(--warn); }
    .conf-banner { border-radius: 10px; padding: .6rem .75rem; margin-bottom: .6rem; font-size: .8rem; line-height: 1.35; }
    .conf-banner.ok    { background: #12301f; border: 1px solid #22c55e; color: #bbf7d0; }
    .conf-banner.aviso { background: #3a2a10; border: 1px solid var(--warn); color: #fde68a; }
    .pc-conf { font-size: .74rem; font-weight: 700; color: #4ade80; margin-top: .35rem; }
    .item-card.excluido { opacity: .4; }

    /* Header do card */
    .item-header { display: flex; align-items: flex-start; gap: .5rem; margin-bottom: .6rem; }
    .item-header-left { flex: 1; min-width: 0; }
    .item-nome  { font-size: .9rem; font-weight: 700; line-height: 1.2; }
    .item-cat   { font-size: .72rem; color: var(--txt2); margin-top: .1rem; }
    .item-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; flex-shrink: 0; }
    .item-total { font-size: .9rem; font-weight: 700; color: var(--verde); }

    /* Grid de campos */
    .item-campos { border-top: 1px solid var(--borda); padding-top: .55rem; }
    .campos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem .6rem; margin-bottom: .5rem; }
    .campo-bloco { display: flex; flex-direction: column; gap: .2rem; }
    .campo-bloco.campo-full { grid-column: 1 / -1; }
    .campo-lbl  { font-size: .68rem; color: var(--txt2); text-transform: uppercase; letter-spacing: .03em; }
    .campo-val  { font-size: .85rem; color: var(--txt2); }
    .campo-input-row { display: flex; align-items: center; gap: .3rem; }
    .campo-rs   { font-size: .78rem; color: var(--txt2); flex-shrink: 0; }
    .campo-un   { font-size: .75rem; color: var(--txt2); flex-shrink: 0; }

    input[type=number], input.campo-text {
      flex: 1; background: var(--bg); border: 1.5px solid var(--borda);
      border-radius: 8px; color: var(--txt); font-size: 1rem; font-weight: 600;
      text-align: center; padding: .4rem .3rem; outline: none;
      -webkit-appearance: none; -moz-appearance: textfield; width: 100%;
    }
    input.campo-text { text-align: right; padding-right: .5rem; }
    input[type=number]:focus, input.campo-text:focus { border-color: var(--verde); }

    /* Toggle (divergência) */
    .tog-row  { display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem; }
    .tog-lbl  { font-size: .74rem; flex: 1; }
    .tog-lbl.warn { color: var(--warn); }
    .toggle   { position: relative; width: 38px; height: 22px; flex-shrink: 0; display: inline-block; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .tog-track {
      position: absolute; inset: 0; background: var(--borda);
      border-radius: 22px; cursor: pointer; transition: .2s;
    }
    .tog-track::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    .toggle input:checked + .tog-track { background: var(--warn); }
    .toggle input:checked + .tog-track::before { transform: translateX(16px); }

    /* Check de recebimento — checkbox nativo estilizado (confiável no iOS) */
    input.check-rec {
      -webkit-appearance: none; appearance: none;
      width: 36px; height: 36px; flex-shrink: 0;
      border: 2px solid #6b7280; border-radius: 6px;
      background: transparent; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    input.check-rec:checked {
      background: #22c55e; border-color: #16a34a;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 22px;
    }

    .obs-input-item {
      display: none; width: 100%; background: var(--bg); border: 1px solid var(--borda);
      border-radius: 8px; color: var(--txt); font-size: .82rem;
      padding: .45rem .6rem; margin-top: .4rem; outline: none;
    }
    .obs-input-item:focus { border-color: var(--warn); }

    /* Rodapé */
    .rodape-fixo {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: .75rem 1rem; background: var(--bg); border-top: 1px solid var(--borda);
    }
    .btn-confirmar {
      width: 100%; background: var(--verde); color: #fff; border: none;
      border-radius: 12px; font-size: 1.05rem; font-weight: 700;
      padding: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-confirmar:active  { opacity: .85; }
    .btn-confirmar:disabled { background: var(--borda); color: var(--txt2); cursor: default; }

    /* Toast */
    #toast {
      position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: .65rem 1.2rem;
      border-radius: 20px; font-size: .9rem; display: none; z-index: 999;
      white-space: nowrap; max-width: 90vw;
    }
    #toast.ok  { background: var(--verde); }
    #toast.err { background: var(--danger); }

    .spin {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: s .7s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══ TELA LOGIN ══ -->
<div id="tela-login">
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="Tambaqui de Banda">
      <h2>Recebimento de Pedidos</h2>
    </div>
    <label class="login-label">E-mail</label>
    <input type="email" id="login-email" placeholder="seu@email.com"
      onkeydown="if(event.key==='Enter') document.getElementById('login-senha').focus()">
    <label class="login-label">Senha</label>
    <input type="password" id="login-senha" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') fazerLogin()">
    <button class="btn-entrar" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-erro" id="login-erro"></div>
  </div>
</div>

<!-- ══ TELA LISTA ══ -->
<div id="tela-lista">
  <div class="cabecalho">
    <div class="cab-row">
      <img src="logo.png" alt="">
      <h1>Pendentes de Recebimento</h1>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="lista-body" id="lista-pedidos">
    <div class="lista-vazia"><div class="ico">⏳</div>Carregando...</div>
  </div>
</div>

<!-- ══ TELA PEDIDO ══ -->
<div id="tela-pedido">
  <div class="cabecalho">
    <div class="cab-row">
      <button class="btn-voltar" onclick="voltarLista()">← Voltar</button>
      <h1 id="ped-titulo">Pedido</h1>
    </div>
    <div style="font-size:.78rem;color:var(--txt2);margin-top:.2rem;padding-left:.2rem" id="ped-info"></div>
  </div>

  <!-- ONDE ENTROU: a nota do Estoque Central vem direto para la e e recebida la.
       Fica gravado em cmp_recebimentos.local porque o estorno desfaz no mesmo lugar. -->
  <div id="rec-local-box" style="background:#0f2e1c;border-bottom:1px solid #1f6b3f;
       padding:.7rem 1rem">
    <label class="campo-lbl" style="margin-bottom:.3rem">📍 Onde a mercadoria entrou *</label>
    <select id="rec-local" onchange="_pintarLocalRecebMob()" style="width:100%">
      <option value="ESTOQUE_LOJA" selected>🏪 Estoque da Loja</option>
      <option value="CENTRAL">🏭 Estoque Central</option>
      <option value="ESTOQUE DELIVERY">🛵 Estoque Delivery P10</option>
    </select>
    <div id="rec-local-hint" style="font-size:.72rem;color:var(--txt2);margin-top:.3rem">O padrão é a loja.</div>
  </div>

  <div class="campos-bloco">
    <div>
      <label class="campo-lbl">📅 Data Recebimento *</label>
      <input type="date" id="rec-data">
    </div>
    <div>
      <label class="campo-lbl">📆 Vencimento *</label>
      <input type="date" id="rec-venc" onchange="renderPreviewParcelasMob()">
      <div style="display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap">
        <button type="button" style="flex:1;min-width:3.4rem;padding:.4rem 0;font-size:.78rem;border:1px solid currentColor;border-radius:8px;background:transparent;color:var(--txt2);opacity:.9" onclick="_atalhoVenc('rec-venc', 0, 'rec-data')">À vista</button>
        <button type="button" style="flex:1;min-width:3.4rem;padding:.4rem 0;font-size:.78rem;border:1px solid currentColor;border-radius:8px;background:transparent;color:var(--txt2);opacity:.9" onclick="_atalhoVenc('rec-venc', 7, 'rec-data')">7 dias</button>
        <button type="button" style="flex:1;min-width:3.4rem;padding:.4rem 0;font-size:.78rem;border:1px solid currentColor;border-radius:8px;background:transparent;color:var(--txt2);opacity:.9" onclick="_atalhoVenc('rec-venc', 15, 'rec-data')">15 dias</button>
        <button type="button" style="flex:1;min-width:3.4rem;padding:.4rem 0;font-size:.78rem;border:1px solid currentColor;border-radius:8px;background:transparent;color:var(--txt2);opacity:.9" onclick="_atalhoVenc('rec-venc', 30, 'rec-data')">30 dias</button>
      </div>
    </div>
    <div>
      <label class="campo-lbl">🔢 Parcelas</label>
      <select id="rec-parcelas" onchange="renderPreviewParcelasMob()">
        <option value="1" selected>À vista (1x)</option>
      </select>
    </div>
    <div id="rec-parc-box" style="display:none;grid-column:1/-1">
      <label class="campo-lbl">Intervalo entre parcelas</label>
      <select id="rec-parcela-int" onchange="renderPreviewParcelasMob()">
        <option value="mensal" selected>Mensal (mesmo dia)</option>
        <option value="7">A cada 7 dias</option>
        <option value="14">A cada 14 dias</option>
        <option value="15">A cada 15 dias</option>
        <option value="21">A cada 21 dias</option>
        <option value="28">A cada 28 dias</option>
        <option value="30">A cada 30 dias</option>
      </select>
      <div id="rec-parcelas-preview" style="font-size:.78rem;color:var(--txt2);margin-top:.35rem;line-height:1.7"></div>
    </div>
    <div>
      <label class="campo-lbl">🧾 Nº NF / Documento</label>
      <input type="text" id="rec-nf" placeholder="Opcional">
    </div>
    <div>
      <label class="campo-lbl">➕ Acréscimo (R$)</label>
      <input type="text" id="rec-acrescimo" placeholder="0,00" inputmode="decimal"
        oninput="mascaraMoeda(this);atualizarTotalGeral()"
        onfocus="moedaFocus(this)"
        onblur="moedaBlur(this);atualizarTotalGeral()">
    </div>
  </div>

  <div class="itens-corpo" id="rec-itens"></div>

  <div class="rodape-fixo">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0 .6rem;border-top:1px solid var(--borda);margin-bottom:.5rem">
      <span style="font-size:.8rem;color:var(--txt2)">👤 <span id="rec-responsavel" style="color:var(--txt)">—</span></span>
      <span style="font-size:.85rem;font-weight:700">
        Total: <span id="rec-total" style="color:var(--verde);font-size:1.05rem">R$ 0,00</span>
      </span>
      <span id="rec-total-bonif" style="display:none;font-size:.72rem;color:var(--txt2);width:100%;text-align:right"></span>
    </div>
    <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarRecebimento()">
      ✅ Confirmar Recebimento
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

let sb   = null;
let user = null;
let _pedidoAtual = null;

// A data de HOJE no relogio de quem esta usando o sistema - NAO em UTC.
// `new Date().toISOString().slice(0,10)` devolve a data em UTC, e Manaus e
// UTC-4: das 20h em diante ele ja responde o dia seguinte. Como a contagem e
// feita entre 21h e 23h, isso carimbava a noite inteira um dia a frente.
// Medido em 09/09/2026: 127 de 168 inventarios do Centro desde 01/09 estavam
// um dia a frente. Os outros 41 nao estavam porque a tela tinha sido ABERTA
// antes das 20h (o campo data-inv e preenchido uma vez, no DOMContentLoaded),
// e por isso o erro vinha em blocos de uma noite inteira - parecia um segundo
// caminho no codigo, e nao era: e sempre este.
function hojeLocal() {
  // MANAUS, nao o relogio do aparelho. `new Date()` + getDate() devolve o dia do
  // fuso em que o celular esta configurado: na noite de 15/09/2026 o Kevin gravou
  // 15/09 as 22:27 e o Yefecson gravou 16/09 as 22:28, mesma noite, aparelhos
  // diferentes. Foram 138 de 356 inventarios errados desde 01/09 - e o que fez a
  // contagem da churrasqueira sumir do dia 15 e a equipe levar bronca por um erro
  // que nao era dela. en-CA devolve YYYY-MM-DD ja no fuso pedido.
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Manaus', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
}

function mostrar(id) {
  ['tela-login','tela-lista','tela-pedido'].forEach(t => {
    const el = document.getElementById(t);
    el.style.display = (t === id) ? 'flex' : 'none';
    if (t === id) el.style.flexDirection = 'column';
  });
}

function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = tipo === 'ok' ? 'ok' : 'err';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function brl(v) {
  return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function mascaraMoeda(el) {
  let v = el.value.replace(/[^\d,]/g, '');
  const partes = v.split(',');
  const intRaw = partes[0].replace(/\D/g, '');
  const intFmt = intRaw ? parseInt(intRaw, 10).toLocaleString('pt-BR') : '';
  const dec    = partes[1] !== undefined ? partes[1].replace(/\D/g, '').slice(0, 2) : null;
  el.value     = dec !== null ? `${intFmt},${dec}` : intFmt;
}
function mascaraMoeda4(el) {
  let v = el.value.replace(/[^\d,]/g, '');
  const partes = v.split(',');
  const intRaw = partes[0].replace(/\D/g, '');
  const intFmt = intRaw ? parseInt(intRaw, 10).toLocaleString('pt-BR') : '';
  const dec    = partes[1] !== undefined ? partes[1].replace(/\D/g, '').slice(0, 4) : null;
  el.value     = dec !== null ? `${intFmt},${dec}` : intFmt;
}
function moedaFocus(el) {
  if (el.value.endsWith(',00')) el.value = el.value.slice(0, -3);
}
function moedaBlur(el) {
  const n = parseFloat((el.value || '0').replace(/\./g,'').replace(',','.')) || 0;
  el.value = n ? n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
}
function moedaBlur4(el) {
  const n = parseFloat((el.value || '0').replace(/\./g,'').replace(',','.')) || 0;
  el.value = n ? n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) : '';
}
function parseMoeda(id) {
  const v = document.getElementById(id)?.value || '0';
  return parseFloat(v.replace(/\./g,'').replace(',','.')) || 0;
}
function setMoeda(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  const n = parseFloat(val) || 0;
  el.value = n ? n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
}

// ── INTEGRAÇÃO FINANCEIRO (mobile) ────────────────────────────────
function isCompExterna(forn) {
  return String(forn || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim() === 'comprador externo';
}

// Mesmos IDs do desktop (app.js). O comprador externo compra com o PIX do Nubank;
// Santander nunca e banco de despesa dele — e a conta da empresa, de onde sai a
// transferencia para o Nubank.
const BANCO_NUBANK_ID_MOB = 'c342ece3-9015-40d6-a5ce-72c668f17395';
const BANCO_CAIXA_ID_MOB  = '5f8f152e-8ef7-47ad-8df3-b251f4225a1f';

// ════════════════════════════════════════════════════════════════
// PEDIDO CONJUNTO — CENTRO + DELIVERY P10 (01/10/2026) — mesma regra do app.js
//   1. "Onde a mercadoria entrou" manda: no Estoque da Loja, o item do Delivery P10
//      vai direto para o ESTOQUE DELIVERY; no Estoque Central, TUDO entra no CENTRAL
//      e cada loja pede o seu por transferencia (gravado no item, em
//      cmp_recebimento_itens.local, para o estorno desfazer no mesmo lugar);
//   2. um lancamento so, com rateio por plano de contas x unidade
//      (rascunho_rateio_itens.unidade_id) — a DRE leva cada linha para a sua loja.
// ════════════════════════════════════════════════════════════════
const LOCAL_ESTOQUE_P10 = 'ESTOQUE DELIVERY';
function _localDoItemReceb(unidade_uso, localReceb) {
  const l = localReceb || 'ESTOQUE_LOJA';
  return l === 'ESTOQUE_LOJA' && _normNome(unidade_uso || '') === _normNome('Delivery P10') ? LOCAL_ESTOQUE_P10 : l;
}
function _linhaRateio(r, extra) {
  return { plano_conta_id: r.plano_conta_id, valor: r.valor, descricao: r.descricao || '',
    ...(r.unidade_id ? { unidade_id: r.unidade_id } : {}), ...extra };
}
// Rateio pelo que foi RECEBIDO, por plano x unidade. Bonificado fora.
// unidade_id so na linha quando o pedido tem mais de uma unidade.
async function _rateioDoPedido(pedido_num) {
  const { data: recebs } = await sb.from('cmp_recebimentos').select('id').eq('pedido_num', pedido_num);
  const ids = (recebs || []).map(r => r.id);
  if (!ids.length) return { linhas: [], unidadePrincipal: null };
  const [{ data: itens }, { data: compras }, { data: unis }] = await Promise.all([
    sb.from('cmp_recebimento_itens').select('compra_id,categoria,total_recebido,bonificado').in('recebimento_id', ids),
    sb.from('cmp_compras').select('id,categoria,plano_conta,unidade_uso').eq('pedido_num', pedido_num),
    sb.from('unidades').select('id,nome'),
  ]);
  const compraDe = {};
  (compras || []).forEach(c => { compraDe[c.id] = c; });
  const cats = [...new Set((compras || []).map(c => c.categoria).concat((itens || []).map(i => i.categoria)).filter(Boolean))];
  const { data: catRows } = cats.length
    ? await sb.from('cmp_categorias').select('nome,plano_conta,plano_conta_id').in('nome', cats) : { data: [] };
  const catDe = {};
  (catRows || []).forEach(c => { catDe[c.nome] = c; });
  const grupos = {};
  (itens || []).forEach(it => {
    const v = Number(it.total_recebido) || 0;
    if (it.bonificado || !(v > 0)) return;
    const c      = compraDe[it.compra_id] || {};
    const catNom = c.categoria || it.categoria || '';
    const pcId   = catDe[catNom]?.plano_conta_id || null;
    const pcNome = catDe[catNom]?.plano_conta || c.plano_conta || catNom || '—';
    const uni    = (unis || []).find(u => _normNome(u.nome) === _normNome(c.unidade_uso || '')) || null;
    const k = (pcId || pcNome) + '|' + (uni?.id || '');
    if (!grupos[k]) grupos[k] = { plano_conta_id: pcId, nome: pcNome, unidade_id: uni?.id || null, valor: 0 };
    grupos[k].valor += v;
  });
  const linhas = Object.values(grupos).map(g => ({ ...g, valor: Math.round(g.valor * 100) / 100 }));
  const porUni = {};
  linhas.forEach(l => { if (l.unidade_id) porUni[l.unidade_id] = (porUni[l.unidade_id] || 0) + l.valor; });
  const uIds = Object.keys(porUni);
  const unidadePrincipal = uIds.sort((a, b) => porUni[b] - porUni[a])[0] || null;
  if (uIds.length < 2) linhas.forEach(l => { delete l.unidade_id; });
  return { linhas, unidadePrincipal };
}
// Reparte as linhas do rateio num valor (a parcela), fechando o centavo.
function _ratearValor(linhas, total) {
  const soma = linhas.reduce((s, l) => s + l.valor, 0);
  if (!(soma > 0)) return [];
  const out = linhas.map(l => ({ ...l, valor: Math.round(l.valor * total / soma * 100) / 100 }));
  const dif = Math.round((total - out.reduce((s, l) => s + l.valor, 0)) * 100) / 100;
  if (dif) out[0].valor = Math.round((out[0].valor + dif) * 100) / 100;
  return out.filter(l => l.valor !== 0);
}

// `enviarDespesaCompExternoMobile` foi removida em 05/11/2026: ela dava insert
// direto em `lancamentos`, pulando as Integracoes Pendentes. Quem faz esse
// envio agora e `gerarContaFinanceiroMobile`, chamada por
// `_executarFinalizarCompExtMob`.

// Soma o total dos recebimentos de um pedido, IGNORANDO cabeçalhos órfãos (sem itens),
// que inflariam o valor da conta (valor = soma de TODOS os cmp_recebimentos do pedido).
async function _totalRecebComItem(pedido_num) {
  const { data: todosReceb } = await sb.from('cmp_recebimentos').select('id,total_recebido').eq('pedido_num', pedido_num);
  const ids = (todosReceb || []).map(r => r.id);
  if (!ids.length) return 0;
  const { data: ie } = await sb.from('cmp_recebimento_itens').select('recebimento_id').in('recebimento_id', ids);
  const comItem = new Set((ie || []).map(i => i.recebimento_id));
  return (todosReceb || []).filter(r => comItem.has(r.id)).reduce((s, r) => s + (r.total_recebido || 0), 0);
}

async function _executarFinalizarCompExtMob(pedido_num, conta, ref) {
  // ANTI-DUPLICATA — o pedido ja tem lancamento no financeiro? Entao a despesa dele
  // ja existe: so amarra a conta nela e sai.
  //
  // A trava de cima (`!contaFinal.lancamento_id`) nao basta. Quando o pagamento e em
  // DINHEIRO, quem cria o lancamento e o financeiro, pelo botao "Pagamento em Dinheiro
  // — Caixa" ("Adiantamento Pedido #X — Dinheiro"), e ele nao escreve de volta em
  // `cmp_contas_pagar` — nem em `lancamento_id`, nem em `adiantamento_lancamento_id`.
  // Do lado do estoque os dois campos ficam nulos, nada trava, e o recebimento cria
  // uma SEGUNDA despesa do mesmo pedido. Foi assim que sairam 34 copias entre
  // 01/08 e 16/09/2026 (R$ 8.384 de despesa em dobro no DRE), todas com a assinatura
  // desta tela: pago, sem banco e sem unidade. Conferir por `numero_pedido` pega o
  // caso do dinheiro tambem, porque esse campo sempre existe.
  const { data: jaLanc } = await sb.from('lancamentos')
    .select('id').eq('numero_pedido', pedido_num).limit(1);
  if (jaLanc?.length) {
    await sb.from('cmp_contas_pagar').update({ lancamento_id: jaLanc[0].id }).eq('id', conta.id);
    return;
  }

  // O banco NAO e mais escolhido aqui. Ate 05/11/2026 esta tela chutava Nubank
  // quando nao havia adiantamento; agora a despesa vai como rascunho e quem aprova,
  // no financeiro, diz de onde saiu o dinheiro. A trava abaixo fica: adiantamento
  // ja pago no Caixa = a saida do pedido ja aconteceu, nao se cria outra despesa.
  if (conta.adiantamento_lancamento_id) {
    const { data: adLanc } = await sb.from('lancamentos')
      .select('banco_id,status').eq('id', conta.adiantamento_lancamento_id).maybeSingle();
    if (adLanc?.status === 'pago' && adLanc.banco_id === BANCO_CAIXA_ID_MOB) {
      await sb.from('cmp_contas_pagar').update({ lancamento_id: conta.adiantamento_lancamento_id }).eq('id', conta.id);
      return;
    }
  }

  const totalAcum = await _totalRecebComItem(pedido_num);

  const dataRec = hojeLocal();
  const venc = conta.vencimento || dataRec;

  // VAI PARA AS INTEGRAÇÕES PENDENTES, não direto para o Contas a Pagar.
  // Mesma mudança do desktop (app.js enviarDespesaCompExterno, 05/11/2026): o
  // comprador externo era o único fluxo que pulava a aprovação do financeiro e
  // nascia com o banco chutado em Nubank. Ver o comentário longo lá e o caso do
  // pedido #02081. `gerarContaFinanceiroMobile` grava rascunho, tem a trava
  // anti-duplicata e resolve categoria/unidade/rateio pelo banco (_rateioDoPedido),
  // o que também dispensa a busca de itens e de unidade que havia aqui.
  const { data: _fp } = await sb.from('cmp_compras').select('forma_pagamento')
    .eq('pedido_num', pedido_num).not('forma_pagamento', 'is', null).limit(1);
  await gerarContaFinanceiroMobile({
    formaPgto: _fp?.[0]?.forma_pagamento || '',
    parcelas: conta?.parcelas || 1, parcelaIntervalo: conta?.parcela_intervalo || 'mensal',
    pedido_num, vencimento: venc, valor: totalAcum,
    fornecedor_id:   ref?.fornecedor_id || null,
    fornecedor_nome: ref?.fornecedor_nome || 'COMPRADOR EXTERNO',
    categoria:       ref?.categoria || '',
    nf_numero: null, conta_id: conta.id,
    unidade_uso:     ref?.unidade_uso || '',
  });
}

async function _executarFinalizarRegularMob(pedido_num, conta, ref) {
  const totalAcum = await _totalRecebComItem(pedido_num);
  if (!totalAcum) return;

  const dataRec = hojeLocal();
  const venc = conta?.vencimento || dataRec;

  // Grava o valor real recebido — cria a conta se ela não existir (ex: recebimento antigo que não a criou)
  // Sem upsert: cmp_contas_pagar nao tem UNIQUE em pedido_num e o onConflict falhava
  // sempre (42P10), sem aviso. Procura a conta do pedido e atualiza, ou cria. (22/10/2026)
  const { data: _cpEx } = await sb.from('cmp_contas_pagar')
    .select('id').eq('pedido_num', pedido_num).order('criado_em').limit(1);
  const _cpCampos = { fornecedor: ref?.fornecedor_nome || '', valor: totalAcum, vencimento: venc, status: 'pendente' };
  const { data: contaUp, error: errCp } = await (_cpEx?.length
    ? sb.from('cmp_contas_pagar').update(_cpCampos).eq('id', _cpEx[0].id)
    : sb.from('cmp_contas_pagar').insert([{ pedido_num, ..._cpCampos }])).select('id').single();
  if (errCp) toast('Não foi possível gravar a conta a pagar: ' + errCp.message, 'err');

  await gerarContaFinanceiroMobile({
    parcelas: conta?.parcelas || 1, parcelaIntervalo: conta?.parcela_intervalo || 'mensal',
    pedido_num, vencimento: venc, valor: totalAcum,
    fornecedor_id: ref?.fornecedor_id || null,
    fornecedor_nome: ref?.fornecedor_nome || '',
    categoria: ref?.categoria || '',
    nf_numero: null, conta_id: contaUp?.id || conta?.id || null,
    unidade_uso: ref?.unidade_uso || '',
  });
}

async function finalizarPedidoRegularMob(pedido_num) {
  if (!confirm(`Fechar pedido ${pedido_num}?\nItens não entregues serão marcados como dispensados e o total recebido será enviado ao financeiro.`)) return;

  await sb.from('cmp_compras')
    .update({ status_receb: 'dispensado' })
    .eq('pedido_num', pedido_num)
    .not('status_receb', 'in', '("recebido","dispensado","cancelado")');

  const { data: conta } = await sb.from('cmp_contas_pagar')
    .select('id,lancamento_id,vencimento,parcelas,parcela_intervalo').eq('pedido_num', pedido_num).maybeSingle();

  if (!conta?.lancamento_id) {
    const { data: refItem } = await sb.from('cmp_compras')
      .select('fornecedor_nome,fornecedor_id,categoria,unidade_uso').eq('pedido_num', pedido_num).limit(1).maybeSingle();
    await _executarFinalizarRegularMob(pedido_num, conta, refItem);
  }

  toast(`${pedido_num} fechado e enviado ao financeiro ✅`, 'ok');
  await carregarPedidosPendentes();
}

async function finalizarPedidoCompExtMob(pedido_num) {
  if (!confirm(`Finalizar pedido ${pedido_num}?\nItens não entregues serão marcados como dispensados e o total recebido será enviado ao financeiro.`)) return;

  await sb.from('cmp_compras')
    .update({ status_receb: 'dispensado' })
    .eq('pedido_num', pedido_num)
    .not('status_receb', 'in', '("recebido","dispensado","cancelado")');

  const { data: conta } = await sb.from('cmp_contas_pagar')
    .select('id,adiantamento_lancamento_id,lancamento_id,vencimento').eq('pedido_num', pedido_num).maybeSingle();
  if (!conta) { toast('Conta a pagar não encontrada.', 'err'); return; }
  if (conta.lancamento_id) { toast('Pedido já foi enviado ao financeiro.', 'err'); return; }

  const { data: refItem } = await sb.from('cmp_compras')
    .select('fornecedor_nome,fornecedor_id,unidade_uso').eq('pedido_num', pedido_num).limit(1).maybeSingle();

  await _executarFinalizarCompExtMob(pedido_num, conta, refItem);
  toast(`${pedido_num} finalizado e enviado ao financeiro! ✅`, 'ok');
  await carregarPedidosPendentes();
}

async function gerarContaFinanceiroMobile({ pedido_num, vencimento, valor, fornecedor_id, fornecedor_nome, categoria, nf_numero, conta_id, unidade_uso, parcelas = 1, parcelaIntervalo = 'mensal', formaPgto = '' }) {
  // Fluxo de aprovação (rascunho → Integrações Pendentes) é o padrão permanente, igual
  // ao desktop (modoIntegracaoProducao). O antigo toggle "Modo Teste/Produção" foi
  // removido da interface, mas esta tela ainda lia a chave no localStorage — e
  // localStorage NÃO expira: num celular que usou a versão antiga a chave podia
  // continuar em 'producao' e o recebimento gravava direto em `lancamentos`,
  // pulando a aprovação. Agora nunca grava direto.
  const producao = false;

  // Resolve plano_conta_id via cmp_categorias
  let plano_conta_id = null;
  if (categoria) {
    const { data: catData } = await sb.from('cmp_categorias').select('plano_conta_id').eq('nome', categoria).maybeSingle();
    plano_conta_id = catData?.plano_conta_id || null;
  }

  // Resolve unidade_id
  let unidade_id = null;
  if (unidade_uso) {
    const { data: uniData } = await sb.from('unidades').select('id').ilike('nome', unidade_uso).maybeSingle();
    unidade_id = uniData?.id || null;
  }

  // Rateio pelo que foi recebido: plano de contas x unidade. Uma linha so = sem
  // rateio (o de sempre). Antes ia tudo no plano e na unidade do PRIMEIRO item.
  const { linhas: _rat, unidadePrincipal } = await _rateioDoPedido(pedido_num);
  const temRateio = _rat.length > 1;
  if (_rat.length === 1 && _rat[0].plano_conta_id) plano_conta_id = _rat[0].plano_conta_id;
  if (unidadePrincipal) unidade_id = unidadePrincipal;

  const dadosBase = {
    descricao:      `Pedido ${pedido_num} — ${fornecedor_nome}`,
    valor,
    vencimento,
    tipo:           'pagar',
    status:         'pendente',
    fornecedor_id:  fornecedor_id || null,
    plano_conta_id: temRateio ? null : plano_conta_id,
    numero_pedido:  pedido_num,          // sempre o pedido — NF fica nas observações
    // A forma de pagamento vai na observação ("Pedido #X — Dinheiro"): é por ela que o
    // financeiro mostra o card de Dinheiro em vez de Transferência (09/11/2026).
    observacoes:    `Pedido ${pedido_num}` + (formaPgto ? ` — ${formaPgto}` : '') + (nf_numero ? ` — NF ${nf_numero}` : ''),
    acrescimo:      0,
    desconto:       0,
    tem_rateio:     temRateio,
    unidade_id,
  };

  // 1x (padrão) devolve uma parcela só — o fluxo antigo, inteiro.
  const parcs = _montarParcelas({ valor, vencimento, parcelas, intervalo: parcelaIntervalo });

  if (!producao) {
    // Trava anti-duplicata: não cria rascunho se o pedido já tem lançamento ou rascunho no financeiro.
    // Checa numero_pedido E descrição "Pedido #XXXXX" (pega casos em que o numero_pedido virou o NF).
    const { data: jaLancNum } = await sb.from('lancamentos').select('id').eq('numero_pedido', pedido_num).limit(1);
    const { data: jaLancDesc } = await sb.from('lancamentos').select('id').ilike('descricao', `Pedido ${pedido_num}%`).limit(1);
    const { data: jaRasc } = await sb.from('lancamentos_rascunho').select('id').eq('pedido_num', pedido_num).limit(1);
    if (jaLancNum?.length || jaLancDesc?.length || jaRasc?.length) { toast('Pedido já está no financeiro — rascunho não criado.', 'err'); return; }
    // Um rascunho por parcela (1x = um só, como sempre foi)
    for (const p of parcs) {
      const { data: rasc, error } = await sb.from('lancamentos_rascunho').insert([{
        ...dadosBase, pedido_num, conta_id: conta_id || null,
        descricao:   _descParcela(dadosBase.descricao, p),
        observacoes: _obsParcela(dadosBase.observacoes, p),
        valor:       p.total,
        vencimento:  p.vencimento,
      }]).select('id').single();
      if (error) { toast('Aviso: rascunho financeiro não criado — ' + error.message, 'err'); return; }
      if (temRateio && rasc?.id) {
        const { error: eRat } = await sb.from('rascunho_rateio_itens')
          .insert(_ratearValor(_rat, p.total).map(r => _linhaRateio(r, { rascunho_id: rasc.id })));
        if (eRat) { toast('Aviso: rateio não gravado — ' + eRat.message, 'err'); return; }
      }
    }
  } else {
    let primeiroLancId = null;
    for (const p of parcs) {
      const { data: lanc, error } = await sb.from('lancamentos').insert([{
        ...dadosBase, data_pagamento: null,
        descricao:   _descParcela(dadosBase.descricao, p),
        observacoes: _obsParcela(dadosBase.observacoes, p),
        valor:       p.total,
        vencimento:  p.vencimento,
      }]).select('id').single();
      if (error) { toast('Aviso: financeiro não registrado — ' + error.message, 'err'); return; }
      if (!primeiroLancId) primeiroLancId = lanc?.id || null;
      if (temRateio && lanc?.id) {
        await sb.from('rateio_itens').insert(_ratearValor(_rat, p.total).map(r => _linhaRateio(r, { lancamento_id: lanc.id })));
      }
    }
    // Parcelado: a conta aponta para a 1ª parcela
    if (conta_id && primeiroLancId) {
      await sb.from('cmp_contas_pagar').update({ lancamento_id: primeiroLancId }).eq('id', conta_id);
    }
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  mostrar('tela-login');
  try {
    sb = supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (session) { user = session.user; irParaLista(); return; }
  } catch(e) {
    console.error('Supabase init error:', e);
  }
});

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha  = document.getElementById('login-senha').value;
  const btn    = document.getElementById('btn-login');
  const erroEl = document.getElementById('login-erro');
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled = true; btn.textContent = 'Entrando...'; erroEl.textContent = '';
  if (!sb) sb = supabase.createClient(SB_URL, SB_KEY);

  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    erroEl.textContent = 'E-mail ou senha incorretos.';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  user = data.user;
  irParaLista();
}

async function sair() {
  await sb.auth.signOut();
  location.reload();
}

async function carregarPedidosPendentes() {
  const { data, error } = await sb
    .from('cmp_compras')
    .select('id,pedido_num,data,data_entrega,fornecedor_nome,produto,produto_id,categoria,unidade_med,quantidade,custo_unit,status_receb')
    .not('status_receb', 'in', '("recebido","dispensado","cancelado")')
    .order('pedido_num', { ascending: false });

  const cont = document.getElementById('lista-pedidos');
  if (error) { cont.innerHTML = `<div class="lista-vazia">Erro: ${error.message}</div>`; return; }
  if (!data?.length) {
    cont.innerHTML = '<div class="lista-vazia"><div class="ico">✅</div>Nenhum pedido pendente.</div>';
    return;
  }

  const grupos = {};
  data.forEach(it => {
    if (!grupos[it.pedido_num]) {
      grupos[it.pedido_num] = {
        pedido_num: it.pedido_num, data: it.data, data_entrega: it.data_entrega,
        forn: it.fornecedor_nome, itens: [], total: 0,
      };
    }
    grupos[it.pedido_num].itens.push(it);
    grupos[it.pedido_num].total += (it.quantidade || 0) * (it.custo_unit || 0);
  });
  // Pedido com itens conferidos e não confirmados aparece marcado — foi o que faltou no #02004
  const _conf = await _confCarregar(data.map(it => it.id));

  cont.innerHTML = Object.values(grupos).map(g => {
    const dataBR   = (g.data || '').split('-').reverse().join('/');
    const entregaBR = g.data_entrega ? g.data_entrega.split('-').reverse().join('/') : null;
    const btnFinalizar = isCompExterna(g.forn)
      ? `<button onclick="event.stopPropagation();finalizarPedidoCompExtMob('${esc(g.pedido_num)}')"
           style="margin-top:8px;width:100%;padding:8px;background:#6f42c1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
           🏁 Finalizar Pedido
         </button>`
      : `<button onclick="event.stopPropagation();finalizarPedidoRegularMob('${esc(g.pedido_num)}')"
           style="margin-top:8px;width:100%;padding:8px;background:#6c757d;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
           🏁 Fechar Pedido
         </button>`;
    return `<div class="pedido-card" onclick="abrirPedido('${esc(g.pedido_num)}')">
      <div class="pc-topo">
        <span class="pc-num">#${esc(g.pedido_num)}</span>
        <span class="pc-tot">${brl(g.total)}</span>
      </div>
      <div class="pc-forn">${esc(g.forn || '—')}</div>
      <div class="pc-info">
        <span>📅 ${dataBR}</span>
        ${entregaBR ? `<span>🚚 ${entregaBR}</span>` : ''}
        <span>📦 ${g.itens.length} item(ns)</span>
      </div>
      ${(() => { const n = g.itens.filter(it => _conf[String(it.id)]).length;
        return n ? `<div class="pc-conf">🟢 ${n}/${g.itens.length} conferidos — falta Confirmar Recebimento</div>` : ''; })()}
      ${btnFinalizar}
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PEDIDO ───────────────────────────────────────────────────────
async function abrirPedido(pedido_num) {
  const { data: itens, error } = await sb
    .from('cmp_compras')
    .select('id,pedido_num,fornecedor_nome,fornecedor_id,comprador,produto,categoria,unidade_med,quantidade,custo_unit,plano_conta,unidade_uso,status_receb,acrescimo,bonificado,forma_pagamento,parcelas,setor')
    .eq('pedido_num', pedido_num)
    .not('status_receb', 'in', '("recebido","dispensado","cancelado")')
    .order('id');

  if (error || !itens?.length) { toast('Pedido não encontrado.', 'err'); return; }

  _pedidoAtual = { pedido_num, itens };

  // Parcelas combinadas no pedido — o estoquista confirma aqui
  _preencherSelectParcelas('rec-parcelas', itens[0]?.parcelas || 1);
  const intSelMob = document.getElementById('rec-parcela-int');
  if (intSelMob) intSelMob.value = 'mensal';
  renderPreviewParcelasMob();

  document.getElementById('ped-titulo').textContent = `Pedido ${pedido_num}`;
  document.getElementById('ped-info').textContent = itens[0].fornecedor_nome || '';

  // hojeLocal(), nao toISOString(): em UTC, depois das 20h de Manaus o campo ja vinha com amanha
  const hoje = hojeLocal();
  document.getElementById('rec-data').value      = hoje;
  document.getElementById('rec-venc').value      = '';
  document.getElementById('rec-nf').value        = '';
  // O lugar volta SEMPRE para a loja ao abrir um pedido. Escolha lembrada e
  // escolha que ninguem mais confere — foi assim que a unidade errada atravessou
  // a noite de 29/08 na contagem.
  // Abre com o LOCAL DE RECEBIMENTO do pedido (02/10/2026; mesma regra do app.js).
  // Fora da loja a caixa fica laranja e diz que veio do pedido; quem recebe pode trocar.
  const _selLocal = document.getElementById('rec-local');
  if (_selLocal) { _selLocal.value = _localRecebDoPedidoMob(_pedidoAtual?.itens?.[0]?.setor); _pintarLocalRecebMob(true); }
  setMoeda('rec-acrescimo', parseFloat(itens[0]?.acrescimo) || 0);

  // Mostra nome do responsável (usuário logado)
  const nomeResp = (user?.user_metadata?.nome || user?.email?.split('@')[0] || '').trim();
  const elResp = document.getElementById('rec-responsavel');
  if (elResp) elResp.textContent = nomeResp || '—';

  // Pedido conjunto (Centro + P10): mostra de que unidade e cada linha (so com 2+ unidades).
  const _multiUni = new Set(itens.map(x => _normNome(x.unidade_uso || ''))).size > 1;
  const _badgeUni = uso => {
    const p10 = _normNome(uso || '') === _normNome('Delivery P10');
    return `<div style="margin-top:.3rem"><span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;${p10 ? 'background:#ea580c;color:#fff' : 'background:#e9ecef;color:#212529'}">Para ${p10 ? '🛵 ' : ''}${esc(uso || '—')}</span></div>`;
  };
  document.getElementById('rec-itens').innerHTML = itens.map(it => {
    const qtdFmt  = (it.quantidade||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
    const precoFmt = (it.custo_unit||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
    const total   = (it.quantidade||0) * (it.custo_unit||0);
    const sid     = String(it.id);
    const dispBadge = it.status_receb === 'dispensado'
      ? `<span style="font-size:11px;background:#6c757d;color:#fff;padding:2px 6px;border-radius:4px;margin-left:6px;">Dispensado</span>`
      : '';
    return `<div class="item-card" id="ic-${sid}">
      <div class="item-header">
        <div class="item-header-left">
          <div class="item-nome">${esc(it.produto)}${dispBadge}</div>
          <div class="item-cat">${esc(it.categoria || '')}</div>
          ${_multiUni ? _badgeUni(it.unidade_uso) : ''}
          <div class="conf-status" id="cs-${sid}"></div>
        </div>
        <div class="item-header-right">
          <div id="tot-${sid}" class="item-total">${brl(total)}</div>
          <input type="checkbox" class="check-rec" id="inc-${sid}"
            onchange="togIncluir('${sid}')"
            title="Receber este item">
        </div>
      </div>

      <div id="campos-${sid}" class="item-campos">
        <div class="campos-grid">
          <div class="campo-bloco">
            <span class="campo-lbl">Pedido</span>
            <span class="campo-val">${qtdFmt} ${esc(it.unidade_med||'')}</span>
          </div>
          <div class="campo-bloco">
            <span class="campo-lbl">Recebido</span>
            <div class="campo-input-row">
              <input type="number" id="qr-${sid}" value="${it.quantidade||0}" min="0" step="any" inputmode="decimal"
                oninput="atualizarTotal('${sid}',${it.quantidade||0})">
              <span class="campo-un">${esc(it.unidade_med||'')}</span>
            </div>
          </div>
          <div class="campo-bloco campo-full">
            <span class="campo-lbl">Preço unitário</span>
            <div class="campo-input-row">
              <span class="campo-rs">R$</span>
              <input type="text" inputmode="decimal" class="campo-text" id="pu-${sid}"
                value="${precoFmt}"
                oninput="mascaraMoeda4(this);atualizarTotal('${sid}',${it.quantidade||0})"
                onblur="moedaBlur4(this);atualizarTotal('${sid}',${it.quantidade||0})"
                onfocus="moedaFocus(this)">
            </div>
          </div>
          <div class="campo-bloco campo-full">
            <span class="campo-lbl" style="color:#FF6B35">Desconto (R$)</span>
            <div class="campo-input-row">
              <span class="campo-rs" style="color:#FF6B35">-</span>
              <input type="text" inputmode="decimal" class="campo-text" id="dc-${sid}"
                value="0,00"
                oninput="mascaraMoeda(this);atualizarTotal('${sid}',${it.quantidade||0})"
                onblur="moedaBlur(this);atualizarTotal('${sid}',${it.quantidade||0})"
                onfocus="moedaFocus(this)">
            </div>
          </div>
        </div>
        <div class="tog-row">
          <span class="tog-lbl">🎁 Bonificado (não gera conta a pagar)</span>
          <label class="toggle">
            <input type="checkbox" id="bn-${sid}" ${it.bonificado ? 'checked' : ''}
              onchange="atualizarTotal('${sid}',${it.quantidade||0})">
            <span class="tog-track"></span>
          </label>
        </div>
        <div class="tog-row">
          <span class="tog-lbl warn">⚠️ Divergência de quantidade</span>
          <label class="toggle">
            <input type="checkbox" id="dt-${sid}" onchange="togObs('${sid}')">
            <span class="tog-track"></span>
          </label>
        </div>
        <input type="text" class="obs-input-item" id="ob-${sid}" placeholder="Descreva a divergência...">
      </div>
    </div>`;
  }).join('');

  mostrar('tela-pedido');
  window.scrollTo(0, 0);

  // Todos os itens começam marcados por padrão; calcula total inicial
  setTimeout(atualizarTotalGeral, 50);

  // Conferência já salva deste pedido (aqui ou em outro aparelho) volta marcada e travada
  _confSubirPendentes().catch(() => {});
  const conf = await _confCarregar(itens.map(i => i.id));
  if (_pedidoAtual?.pedido_num !== pedido_num) return;   // saiu do pedido enquanto carregava
  itens.forEach(it => { const l = conf[String(it.id)]; if (l) _confAplicarMob(it, l); });
  _confBannerMob();
  atualizarTotalGeral();
}

// CONFERÊNCIA SALVA ITEM A ITEM (03/11/2026)
// #02004: a nota foi conferida na sexta 30/10 e nada ficou gravado — o recebimento só vai
// ao banco no botão final; se a internet cai ali, a conferência some sem aviso e o pedido
// continua pendente. Agora cada item marcado no ✓ já grava a conferência (quantidade,
// preço, desconto, bonificado, divergência) em cmp_recebimento_conferencia, sem mexer em
// estoque nem financeiro: o item fica verde e travado, e desmarcar desfaz. Ao reabrir o
// pedido (aqui ou no outro aparelho) a conferência volta, e a lista mostra "N/M conferidos"
// até alguém confirmar o recebimento. Sem internet, o item fica guardado no aparelho e
// sobe sozinho quando a conexão voltar. Mesmo bloco em app.js e recebimento.html.
// ═══════════════════════════════════════════════════════════════════
const _CONF_TAB = 'cmp_recebimento_conferencia';
const _CONF_LS  = 'confReceb:pendentes';   // {compra_id: linha a enviar | {..., _apagar: true}}
const _CONF_COLS = ['compra_id', 'pedido_num', 'qtd_recebida', 'valor_unitario', 'desconto',
  'bonificado', 'divergencia', 'obs', 'conferido_por', 'conferido_em'];

function _confPendLer() { try { return JSON.parse(localStorage.getItem(_CONF_LS) || '{}') || {}; } catch (e) { return {}; } }
function _confPendGravar(p) { try { localStorage.setItem(_CONF_LS, JSON.stringify(p)); } catch (e) {} }

async function _confEnviar(l) {                    // true = o banco aceitou
  try {
    let r;
    if (l._apagar) r = await sb.from(_CONF_TAB).delete().eq('compra_id', l.compra_id);
    else {
      const linha = {};
      _CONF_COLS.forEach(k => { if (l[k] !== undefined) linha[k] = l[k]; });
      r = await sb.from(_CONF_TAB).upsert(linha, { onConflict: 'compra_id' });
    }
    if (r.error) { console.error('conferência não subiu:', r.error.message); return false; }
    return true;
  } catch (e) { console.error('conferência não subiu:', e); return false; }
}

// Guarda no aparelho ANTES de tentar o banco; só tira do aparelho quando o banco aceitou
// esta mesma versão (marcar e desmarcar rápido não pode apagar a versão nova).
async function _confGuardar(l) {
  const linha = { ...l, _v: Date.now() + Math.random() };
  const p = _confPendLer(); p[linha.compra_id] = linha; _confPendGravar(p);
  const ok = await _confEnviar(linha);
  if (ok) { const q = _confPendLer(); if (q[linha.compra_id]?._v === linha._v) { delete q[linha.compra_id]; _confPendGravar(q); } }
  return ok;
}

let _confSubindo = false;
async function _confSubirPendentes() {             // volta da internet: sobe o que ficou no aparelho
  if (_confSubindo) return 0;
  _confSubindo = true;
  let n = 0;
  try {
    for (const l of Object.values(_confPendLer())) {
      if (!(await _confEnviar(l))) continue;
      const q = _confPendLer();
      if (q[l.compra_id]?._v === l._v) { delete q[l.compra_id]; _confPendGravar(q); }
      n++;
    }
  } finally { _confSubindo = false; }
  return n;
}

// {compra_id: linha} dos itens pedidos — o banco mais o que ainda está só no aparelho
async function _confCarregar(compraIds) {
  const out = {}, ids = compraIds.map(String);
  for (let i = 0; i < ids.length; i += 100) {      // .in() grande estoura a URL
    const { data, error } = await sb.from(_CONF_TAB).select('*').in('compra_id', ids.slice(i, i + 100));
    if (error) { console.error('conferência não carregou:', error.message); break; }
    (data || []).forEach(r => { out[r.compra_id] = r; });
  }
  const p = _confPendLer();
  ids.forEach(id => {
    const l = p[id];
    if (!l) return;
    if (l._apagar) delete out[id]; else out[id] = { ...l, _soAparelho: true };
  });
  return out;
}

async function _confLimpar(compraIds) {            // depois do recebimento confirmado
  const ids = compraIds.map(String);
  for (let i = 0; i < ids.length; i += 100) {
    const { error } = await sb.from(_CONF_TAB).delete().in('compra_id', ids.slice(i, i + 100));
    if (error) console.error('conferência não foi limpa:', error.message);
  }
  const p = _confPendLer(); ids.forEach(id => delete p[id]); _confPendGravar(p);
}

function _confHora(iso) {
  try { return new Date(iso).toLocaleTimeString('pt-BR', { timeZone: 'America/Manaus', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

// ── adaptação da conferência à tela do celular ──
const _CONF_CAMPOS_MOB = ['qr', 'pu', 'dc', 'bn', 'dt', 'ob'];
function _confTravarMob(id, travar) {
  _CONF_CAMPOS_MOB.forEach(c => { const el = document.getElementById(`${c}-${id}`); if (el) el.disabled = travar; });
  document.getElementById(`ic-${id}`)?.classList.toggle('conferido', travar);
}
function _confStatusMob(id, estado, l) {
  const el = document.getElementById(`cs-${id}`);
  if (!el) return;
  const quem = l?.conferido_por ? ` por ${esc(l.conferido_por)}` : '';
  el.className = 'conf-status ' + ({ ok: 'ok', salvando: 'esp', aparelho: 'aviso' }[estado] || '');
  el.innerHTML = estado === 'ok'       ? `✓ Conferido${quem} às ${_confHora(l.conferido_em)} · toque no ✓ para desfazer`
               : estado === 'salvando' ? '⏳ Salvando a conferência…'
               : estado === 'aparelho' ? '⚠️ Sem internet: guardado só neste aparelho, sobe quando a conexão voltar'
               : '';
}
function _confLinhaMob(it) {
  const id = String(it.id);
  return {
    compra_id: it.id, pedido_num: _pedidoAtual.pedido_num,
    qtd_recebida:   parseFloat(document.getElementById(`qr-${id}`)?.value) || 0,
    valor_unitario: parseMoeda(`pu-${id}`),
    desconto:       parseMoeda(`dc-${id}`),
    bonificado:     !!document.getElementById(`bn-${id}`)?.checked,
    divergencia:    !!document.getElementById(`dt-${id}`)?.checked,
    obs:            document.getElementById(`ob-${id}`)?.value || '',
    conferido_por:  (user?.user_metadata?.nome || user?.email?.split('@')[0] || '').trim() || null,
    conferido_em:   new Date().toISOString(),
  };
}
function _confAplicarMob(it, l) {
  const id = String(it.id);
  const qr = document.getElementById(`qr-${id}`), pu = document.getElementById(`pu-${id}`);
  if (qr && l.qtd_recebida != null) qr.value = l.qtd_recebida;
  if (pu && l.valor_unitario != null) pu.value = Number(l.valor_unitario).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  setMoeda(`dc-${id}`, Number(l.desconto) || 0);
  const bn = document.getElementById(`bn-${id}`); if (bn) bn.checked = !!l.bonificado;
  atualizarTotal(id, it.quantidade || 0);
  const dt = document.getElementById(`dt-${id}`); if (dt) { dt.checked = !!l.divergencia; togObs(id); }
  const ob = document.getElementById(`ob-${id}`); if (ob) ob.value = l.obs || '';
  const chk = document.getElementById(`inc-${id}`); if (chk) chk.checked = true;
  const tot = document.getElementById(`tot-${id}`); if (tot) tot.style.color = 'var(--verde)';
  _confTravarMob(id, true);
  _confStatusMob(id, l._soAparelho ? 'aparelho' : 'ok', l);
}
function _confBannerMob() {
  const cont = document.getElementById('rec-itens');
  if (!cont || !_pedidoAtual) return;
  let el = document.getElementById('conf-banner');
  if (!el) { el = document.createElement('div'); el.id = 'conf-banner'; cont.prepend(el); }
  const tot = _pedidoAtual.itens.length;
  const ok  = _pedidoAtual.itens.filter(it => document.getElementById(`inc-${it.id}`)?.checked).length;
  const soAqui = _pedidoAtual.itens.filter(it => document.getElementById(`cs-${it.id}`)?.classList.contains('aviso')).length;
  if (!ok) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.className = 'conf-banner ' + (soAqui ? 'aviso' : 'ok');
  el.innerHTML = `<b>${ok} de ${tot} ${tot === 1 ? 'item conferido' : 'itens conferidos'}</b> e salvos.` +
    (soAqui ? ` ${soAqui} ainda só neste aparelho (sem internet).` : '') +
    ` O recebimento <b>só vale</b> depois de tocar em <b>Confirmar Recebimento</b>.`;
}
window.addEventListener('online', async () => {
  if (!(await _confSubirPendentes()) || !_pedidoAtual) return;
  const conf = await _confCarregar(_pedidoAtual.itens.map(i => i.id));
  _pedidoAtual.itens.forEach(it => { const l = conf[String(it.id)]; if (l && !l._soAparelho) _confStatusMob(String(it.id), 'ok', l); });
  _confBannerMob();
});

function voltarLista() {
  _pedidoAtual = null;
  irParaLista();
}

// QUANTIDADE RECEBIDA FORA DO COMUM (04/11/2026) — mesma ideia da trava da contagem.
// O normal aqui e o PEDIDO: de 01/08 a 03/11 entraram 11 itens 10x acima ou abaixo do
// pedido e quase todos eram erro — agua 6 FD lancada 72 (unidade no lugar de fardo),
// canela 0,2 kg lancada 2, saco 100 lancado 1000, coca zero 36 lancada 396. Comparar com
// o historico de compras nao serve: emergencia compra 5 kg de acucar onde o normal e 90.
// Pergunta ao marcar o ✓ (e o momento em que o item e conferido); Cancelar deixa o item
// sem marcar para corrigir. So sugere numero quando ÷10/÷100/÷1000 bate com o pedido.
function _conferirQtdReceb(nome, unidade, pedida, recebida) {
  const p = Number(pedida) || 0, v = Number(recebida) || 0;
  if (p <= 0 || v <= 0) return true;
  const r = v / p;
  if (r < 10 && r > 0.1) return true;
  const fmt = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
  const un = unidade ? ` ${unidade}` : '';
  const sug = r >= 10 ? [10, 100, 1000].map(k => v / k).find(c => Math.abs(c - p) <= p * 0.1) : undefined;
  return confirm(
    `Confira a quantidade de ${nome}:\n\n` +
    `Pedido: ${fmt(p)}${un}\nVocê digitou: ${fmt(v)}${un} (${r >= 10 ? fmt(Math.round(r)) + 'x o pedido' : 'bem menos que o pedido'})\n\n` +
    (sug !== undefined ? `Não seria ${fmt(sug)}${un}?\n\n` : `Confira se a nota está na mesma unidade do pedido (${unidade || 'Un.'}).\n\n`) +
    `Se a quantidade está certa, aperte OK.\nPara corrigir, aperte Cancelar e troque o número.`
  );
}

async function togIncluir(id) {
  const chk   = document.getElementById(`inc-${id}`);
  const totEl = document.getElementById(`tot-${id}`);
  if (!totEl) return;
  const _it = _pedidoAtual?.itens.find(x => String(x.id) === String(id));
  if (chk?.checked && _it && !_conferirQtdReceb(_it.produto, _it.unidade_med, _it.quantidade,
      parseFloat(document.getElementById(`qr-${id}`)?.value))) { chk.checked = false; return; }
  totEl.style.color = chk?.checked ? 'var(--verde)' : 'var(--txt2)';
  atualizarTotalGeral();
  // Marcar = conferido: grava na hora e trava o item. Desmarcar = desfazer.
  const it = _pedidoAtual?.itens.find(x => String(x.id) === String(id));
  if (!it) return;
  if (chk?.checked) {
    const linha = _confLinhaMob(it);
    _confTravarMob(id, true); _confStatusMob(id, 'salvando'); _confBannerMob();
    const ok = await _confGuardar(linha);
    if (!document.getElementById(`inc-${id}`)?.checked) return;   // desfeito enquanto salvava
    _confStatusMob(id, ok ? 'ok' : 'aparelho', linha);
  } else {
    _confTravarMob(id, false); _confStatusMob(id, '');
    await _confGuardar({ compra_id: it.id, pedido_num: _pedidoAtual.pedido_num, _apagar: true });
  }
  _confBannerMob();
}

function atualizarTotal(id, qtdPedida) {
  const qtdRec   = parseFloat(document.getElementById(`qr-${id}`)?.value) || 0;
  const preco    = parseMoeda(`pu-${id}`);
  const desconto = parseMoeda(`dc-${id}`);
  const total    = Math.max(0, qtdRec * preco - desconto);
  const totEl    = document.getElementById(`tot-${id}`);
  if (totEl) totEl.textContent = brl(total);
  if (Math.abs(qtdRec - qtdPedida) > 0.001) {
    const tog = document.getElementById(`dt-${id}`);
    if (tog && !tog.checked) { tog.checked = true; togObs(String(id)); }
  }
  atualizarTotalGeral();
}

function togObs(id) {
  const tog  = document.getElementById(`dt-${id}`);
  const obs  = document.getElementById(`ob-${id}`);
  const card = document.getElementById(`ic-${id}`);
  if (!tog || !obs || !card) return;
  obs.style.display = tog.checked ? 'block' : 'none';
  card.classList.toggle('diverg', tog.checked);
}

// ── PARCELAMENTO (boleto/cartão em N vezes) ──────────────────────
// Padrão 1x: um lançamento só, como sempre foi.
const PARC_MAX = 12;

function _preencherSelectParcelas(id, valor) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const opts = ['<option value="1">À vista (1x)</option>'];
  for (let n = 2; n <= PARC_MAX; n++) opts.push(`<option value="${n}">${n}x</option>`);
  sel.innerHTML = opts.join('');
  sel.value = String(Math.max(1, Math.min(PARC_MAX, parseInt(valor, 10) || 1)));
}

// Divide um total em n parcelas iguais; a PRIMEIRA absorve a sobra dos centavos — é assim
// que o boleto vem do fornecedor (14/10/2026, #01716: 1.316,74 + 1.316,73 + 1.316,73; antes a
// sobra ia na última e as parcelas não batiam com os boletos). Mesma regra em
// app.js e recebimento.html.
function _dividirParcelas(total, n) {
  const cent = Math.round((Number(total) || 0) * 100);
  const base = Math.floor(cent / n);
  const out  = [(cent - base * (n - 1)) / 100];
  for (let i = 1; i < n; i++) out.push(base / 100);
  return out;
}

// 'mensal' mantém o dia do mês (dia 31 cai no último dia do mês curto);
// número = intervalo em dias corridos.
function _datasParcelas(primeiroVenc, n, intervalo) {
  const [Y, M, D] = (primeiroVenc || '').split('-').map(Number);
  if (!Y || !M || !D) return [];
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const out = [];
  for (let i = 0; i < n; i++) {
    if (intervalo === 'mensal') {
      const ultimoDia = new Date(Y, M + i, 0).getDate();
      out.push(fmt(new Date(Y, M - 1 + i, Math.min(D, ultimoDia))));
    } else {
      out.push(fmt(new Date(Y, M - 1, D + i * (parseInt(intervalo, 10) || 30))));
    }
  }
  return out;
}

function _montarParcelas({ valor, vencimento, parcelas = 1, intervalo = 'mensal' }) {
  const n     = Math.max(1, Math.min(PARC_MAX, parseInt(parcelas, 10) || 1));
  const datas = _datasParcelas(vencimento, n, intervalo);
  return _dividirParcelas(valor, n).map((v, i) => ({
    num: i + 1, de: n, total: v, vencimento: datas[i] || vencimento,
  }));
}

function _descParcela(base, p) {
  return p.de > 1 ? `${base} (${p.num}/${p.de})` : base;
}
function _obsParcela(base, p) {
  if (p.de <= 1) return base;
  return base ? `${base} — Parcela ${p.num}/${p.de}` : `Parcela ${p.num}/${p.de}`;
}

// Redistribui o valor recebido entre os rascunhos do pedido (1 ou N parcelas).
async function _sincronizarRascunhoParcelas(pedido_num, notaTotal, acrescimo) {
  const { data: rascs } = await sb.from('lancamentos_rascunho')
    .select('id').eq('pedido_num', pedido_num).order('vencimento');
  if (!rascs?.length) return;
  const notas = _dividirParcelas(notaTotal, rascs.length);
  const acrs  = _dividirParcelas(acrescimo, rascs.length);
  for (let i = 0; i < rascs.length; i++) {
    await sb.from('lancamentos_rascunho').update({ valor: notas[i], acrescimo: acrs[i] }).eq('id', rascs[i].id);
  }
  await _refazerRateioRecebido(pedido_num, 'rascunho_rateio_itens', 'rascunho_id', rascs.map((r, i) => ({ id: r.id, valor: notas[i] })));
}

// Mesma coisa para lançamentos aprovados. Parcela paga = não mexe em nada.
async function _sincronizarLancamentoParcelas(pedido_num, notaTotal, acrescimo) {
  const { data: lancs } = await sb.from('lancamentos')
    .select('id,status').eq('numero_pedido', pedido_num).order('vencimento');
  if (!lancs?.length) return false;
  // Pago nao se mexe; quem recebe ja foi avisado no confirm do recebimento.
  if (lancs.some(l => l.status === 'pago')) return false;
  const notas = _dividirParcelas(notaTotal, lancs.length);
  const acrs  = _dividirParcelas(acrescimo, lancs.length);
  for (let i = 0; i < lancs.length; i++) {
    await sb.from('lancamentos').update({ valor: notas[i], acrescimo: acrs[i] }).eq('id', lancs[i].id);
  }
  await _refazerRateioRecebido(pedido_num, 'rateio_itens', 'lancamento_id', lancs.map((l, i) => ({ id: l.id, valor: notas[i] })));
  return true;
}
// O recebimento muda o valor da conta, mas o rateio (plano x unidade) ficava o do
// PEDIDO: comprador externo vai ao financeiro antes de comprar, a conta nasce com os
// itens pedidos e o recebimento so trocava o valor. 10 contas assim desde o #01650
// (#02018: conta 943,83, rateio somando 1.022,70) - total certo, DRE por categoria
// errada (06/11/2026). Agora o rateio de quem JA TEM rateio e refeito pelo que foi
// recebido, repartido pelo valor de cada parcela. Conta sem rateio (uma categoria so)
// nao e tocada. Grava o novo antes de apagar o antigo: falhando no meio, a conta
// nunca fica sem rateio. Linha sem plano de contas = nao mexe (na duvida, o antigo).
function _repartirRateio(linhas, total) {
  const soma = linhas.reduce((s, l) => s + l.valor, 0);
  if (!(soma > 0)) return [];
  const out = linhas.map(l => ({ ...l, valor: Math.round(l.valor * total / soma * 100) / 100 }));
  const dif = Math.round((total - out.reduce((s, l) => s + l.valor, 0)) * 100) / 100;
  if (dif) out[0].valor = Math.round((out[0].valor + dif) * 100) / 100;
  return out.filter(l => l.valor !== 0);
}
async function _refazerRateioRecebido(pedido_num, tabela, chave, alvos) {
  // alvos: [{ id, valor }] - uma entrada por parcela (lancamento ou rascunho)
  try {
    const ids = alvos.map(a => a.id);
    const { data: antigos, error: eAnt } = await sb.from(tabela).select('id,' + chave).in(chave, ids);
    if (eAnt || !antigos?.length) return;
    const { linhas } = await _rateioDoPedido(pedido_num);
    if (!linhas.length || linhas.some(l => !l.plano_conta_id)) return;
    const comRateio = new Set(antigos.map(a => a[chave]));
    const novas = [];
    alvos.filter(a => comRateio.has(a.id)).forEach(a =>
      _repartirRateio(linhas, a.valor).forEach(r => novas.push(_linhaRateio(r, { [chave]: a.id }))));
    if (!novas.length) return;
    const { data: gravadas, error: eIns } = await sb.from(tabela).insert(novas).select('id');
    if (eIns) { console.warn('rateio nao refeito', pedido_num, eIns.message); return; }
    const { error: eDel } = await sb.from(tabela).delete().in('id', antigos.map(a => a.id));
    if (eDel) {
      console.warn('rateio antigo nao apagado, desfazendo o novo', pedido_num, eDel.message);
      await sb.from(tabela).delete().in('id', (gravadas || []).map(g => g.id));
    }
  } catch (e) { console.warn('rateio nao refeito', pedido_num, e); }
}


function renderPreviewParcelasMob() {
  const n   = Math.max(1, parseInt(document.getElementById('rec-parcelas')?.value, 10) || 1);

  const totalTxt = (document.getElementById('rec-total')?.textContent || '').replace(/[R$\s.]/g, '').replace(',', '.');
  const parcs = _montarParcelas({

}

function atualizarTotalGeral() {
  if (!_pedidoAtual) return;
  let soma = 0, bonif = 0;
  _pedidoAtual.itens.forEach(it => {
    const sid   = String(it.id);
    const chk   = document.getElementById(`inc-${sid}`);

    const preco    = parseMoeda(`pu-${sid}`);

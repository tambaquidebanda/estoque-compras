  }
  renderPreviewParcelasMob();
}

// Campo de data no celular aceita ano de dois digitos: "26" vira 0026-09-15. O banco
// aceita, e a conta some de qualquer filtro por periodo do financeiro sem ter sido
// excluida. Caso real: #01316 e #01287, recebidos por esta tela em 11/09/2026.
// Aceita so ano entre 2020 e o ano atual + 5. Gemea de _dataComAnoValido() no app.js.
function _dataComAnoValido(iso) {
  const ano = parseInt(String(iso || '').slice(0, 4), 10);
  return ano >= 2020 && ano <= new Date().getFullYear() + 5;
}

// As tres camadas contra data errada — gemeas das do app.js (mesma logica, mesmos nomes).
// Camada 1: ano de dois digitos vira 20xx ao SAIR do campo ("26" -> 2026). No blur, nunca
// durante a digitacao, porque cada digito do ano ja dispara change com ano parcial.
function _corrigirAnoCurto(el) {
  const m = /^00(\d{2})-(\d{2})-(\d{2})$/.exec(el.value || '');
  if (!m) return;
  el.value = `20${m[1]}-${m[2]}-${m[3]}`;
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
// Camada 2: limites no campo — o calendario nao oferece ano fora da faixa.
function _prepararCampoData(id) {
  const el = document.getElementById(id);
  if (!el || el.dataset.anoPreparado) return;
  el.min = '2020-01-01';
  el.max = `${new Date().getFullYear() + 5}-12-31`;
  el.addEventListener('blur', () => _corrigirAnoCurto(el));
  el.dataset.anoPreparado = '1';
}
// Camada 3: atalhos de vencimento, a partir da data do recebimento (ou de hoje).
function _atalhoVenc(idCampo, dias, idBase) {
  const el = document.getElementById(idCampo);
  if (!el) return;
  const baseCampo = idBase ? document.getElementById(idBase)?.value : '';
  const base = _dataComAnoValido(baseCampo) ? baseCampo : hojeLocal();
  const [a, m, d] = base.split('-').map(Number);
  const dt = new Date(a, m - 1, d + dias);
  el.value = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
(function _prepararCamposDataRecebimento() {
  const preparar = () => ['rec-data', 'rec-venc'].forEach(_prepararCampoData);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', preparar);
  else preparar();
})();

// ── CONFIRMAR ────────────────────────────────────────────────────
async function confirmarRecebimento() {
  const btn       = document.getElementById('btn-confirmar');
  const dataRec   = document.getElementById('rec-data').value;
  const venc      = document.getElementById('rec-venc').value;
  const parcelas   = Math.max(1, parseInt(document.getElementById('rec-parcelas')?.value, 10) || 1);
  const parcelaInt = document.getElementById('rec-parcela-int')?.value || 'mensal';
  const nf        = document.getElementById('rec-nf').value.trim() || null;
  const acrescimo = parseMoeda('rec-acrescimo');

  if (!dataRec) { toast('Informe a data do recebimento.', 'err'); return; }
  if (!venc)    { toast('Informe a data de vencimento.', 'err'); return; }
  if (!_dataComAnoValido(dataRec)) { toast(`A data do recebimento está com o ano errado (${dataRec.split('-').reverse().join('/')}). Confira o ano.`, 'err'); return; }
  if (!_dataComAnoValido(venc))    { toast(`O vencimento está com o ano errado (${venc.split('-').reverse().join('/')}). Confira o ano.`, 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Salvando...';

  const { pedido_num, itens } = _pedidoAtual;
  const resp = (user?.user_metadata?.nome || user?.email?.split('@')[0] || '').trim();

  // Apenas itens marcados como "Receber agora"
  const itensIncluidos = itens.filter(it => document.getElementById(`inc-${it.id}`)?.checked);
  if (!itensIncluidos.length) {
    toast('Selecione ao menos um item para receber.', 'err');
    btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento';
    return;
  }
  const ref = itensIncluidos[0];

  const itensReceb = itensIncluidos.map(it => {
    const qtdRec   = parseFloat(document.getElementById(`qr-${it.id}`)?.value) || 0;
    const preco    = parseMoeda(`pu-${it.id}`) || it.custo_unit || 0;
    const desconto = parseMoeda(`dc-${it.id}`);
    const totalItem = Math.max(0, qtdRec * preco - desconto);
    // valor_unitario efetivo = total_com_desconto / qtd
    const vlrEfetivo = qtdRec > 0 ? totalItem / qtdRec : preco;
    const diverg = document.getElementById(`dt-${it.id}`)?.checked || false;
    const bonif  = document.getElementById(`bn-${it.id}`)?.checked || false;
    const obs    = document.getElementById(`ob-${it.id}`)?.value || '';
    return {
      compra_id: it.id, produto: it.produto, produto_id: it.produto_id || null,
      categoria: it.categoria || '',
      unidade: it.unidade_med || '', qtd_pedida: it.quantidade || 0,
      qtd_recebida: qtdRec, valor_unitario: vlrEfetivo,
      total_recebido: totalItem, bonificado: bonif,
      divergencia: diverg, obs_divergencia: obs,
    };
  });

  // Trava: item sem valor e sem marca de bonificado é quase sempre esquecimento.
  const _semValor = itensReceb.filter(i => !i.bonificado && i.qtd_recebida > 0 && i.valor_unitario < 0.01);
  if (_semValor.length) {
    const nomes = _semValor.map(i => `• ${i.produto}`).join('\n');
    if (!confirm(
      `Estes itens estão com valor zero e NÃO foram marcados como bonificados:\n\n${nomes}\n\n` +
      `Se for bonificação, cancele e marque "Bonificado".\n\nContinuar mesmo assim?`
    )) { btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento'; return; }
  }

  // Bonificado fica FORA do total que vira conta a pagar (item segue no estoque com valor real).
  const totalItens    = itensReceb.reduce((s, i) => s + (i.bonificado ? 0 : i.total_recebido), 0);
  const totalRecebido = totalItens + acrescimo;
  const temDiverg     = itensReceb.some(i => i.divergencia);

  // Pedido PAGO antes da entrega (Pix, adiantamento): avisa e deixa receber, sem mudar o
  // valor pago. Antes bloqueava, e a mercadoria paga nunca entrava no estoque (22/10/2026,
  // #01806). Receber em dobro continua barrado pela trava logo abaixo.
  const { data: _lancPagos } = await sb.from('lancamentos')
    .select('valor').eq('numero_pedido', pedido_num).eq('status', 'pago');
  if (_lancPagos?.length) {
    const _pago = _lancPagos.reduce((s, l) => s + (Number(l.valor) || 0), 0);
    const _difere = Math.abs(_pago - totalRecebido) >= 0.01;
    if (!confirm(
      `Este pedido já foi pago no financeiro (${brl(_pago)}).\n\n` +
      `O recebimento coloca os itens no estoque e não muda o valor pago.` +
      (_difere ? `\n\nO total deste recebimento (${brl(totalRecebido)}) é diferente do valor pago: avise o financeiro.` : '') +
      `\n\nConfirmar o recebimento?`
    )) { btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento'; return; }
  }

  // Guard anti-duplicação: re-checa no banco o status ATUAL dos itens sendo recebidos.
  // Se todos já estão 'recebido', é uma segunda confirmação (a pessoa clicou 2x — o botão
  // volta a habilitar após ~1,5s). Bloqueia para não gravar um recebimento duplicado.
  const _idsReceb = itensReceb.map(i => i.compra_id).filter(Boolean);
  if (_idsReceb.length) {
    const { data: _statusAtual } = await sb.from('cmp_compras')
      .select('id,status_receb').in('id', _idsReceb);
    const _aindaPendente = (_statusAtual || []).some(c => c.status_receb !== 'recebido');
    if (_statusAtual && _statusAtual.length && !_aindaPendente) {
      toast('Este pedido já foi recebido agora há pouco. Atualize a lista.', 'err');
      btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento';
      voltarLista();
      return;
    }
  }

  // 1. Cabeçalho do recebimento
  const localReceb = document.getElementById('rec-local')?.value || 'ESTOQUE_LOJA';
  // Pedido conjunto: item do Delivery P10 entra no Estoque Delivery, nao no lugar escolhido
  const _usoDoItem = cid => (_pedidoAtual?.itens || []).find(o => o.id === cid)?.unidade_uso || '';
  const _localItem = it => _localDoItemReceb(_usoDoItem(it.compra_id), localReceb);

  const { data: receb, error: errReceb } = await sb.from('cmp_recebimentos').insert([{
    pedido_num, data_receb: dataRec, responsavel: resp,
    fornecedor: ref?.fornecedor_nome || '', comprador: ref?.comprador || '',
    total_recebido: totalRecebido, local: localReceb,
    status: temDiverg ? 'parcial' : 'confirmado',
  }]).select().single();

  if (errReceb) {
    toast('Erro: ' + errReceb.message, 'err');
    btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento';
    return;
  }

  // 2. Itens do recebimento
  const { error: errItens } = await sb.from('cmp_recebimento_itens')
    .insert(itensReceb.map(it => {
      const l = _localItem(it);
      return { ...it, recebimento_id: receb.id, ...(l !== localReceb ? { local: l } : {}) };
    }));
  if (errItens) {
    // Sem itens o cabeçalho vira "fantasma" e inflaria o valor da conta (soma de todos os recebimentos).
    // Desfaz o cabeçalho e aborta — nada de recebimento órfão.
    await sb.from('cmp_recebimentos').delete().eq('id', receb.id);
    toast('Erro ao salvar itens: ' + errItens.message + '. Recebimento cancelado, tente de novo.', 'err');
    btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento';
    return;
  }

  // 3. Atualiza cada item incluído individualmente
  for (const ir of itensReceb) {
    const restante = (ir.qtd_pedida || 0) - (ir.qtd_recebida || 0);
    if (restante <= 0.001) {
      // Totalmente recebido: grava a quantidade REALMENTE recebida (soma de todos os
      // recebimentos deste item), para o pedido refletir o que entrou — inclusive quando
      // o recebido difere do pedido (ex: pediu 3, recebeu 300). Antes ficava a qtd pedida
      // e o financeiro mostrava valor divergente.
      let qtdRecTotal = ir.qtd_recebida;
      try {
        const { data: somaRec } = await sb.from('cmp_recebimento_itens')
          .select('qtd_recebida').eq('compra_id', ir.compra_id);
        const soma = (somaRec || []).reduce((s, r) => s + Number(r.qtd_recebida || 0), 0);
        if (soma > 0) qtdRecTotal = soma;
      } catch (_) {}
      await sb.from('cmp_compras').update({
        quantidade: qtdRecTotal,
        status_receb: 'recebido',
        custo_unit: ir.valor_unitario,
        bonificado: !!ir.bonificado,
      }).eq('id', ir.compra_id);
    } else {
      await sb.from('cmp_compras').update({
        quantidade: Math.max(restante, 0),
        status_receb: 'pendente',
        custo_unit: ir.valor_unitario,
        bonificado: !!ir.bonificado,
      }).eq('id', ir.compra_id);
    }
  }

  // 4. Persiste acréscimo atualizado em todos os itens do pedido
  if (acrescimo !== (parseFloat(_pedidoAtual.itens[0]?.acrescimo) || 0)) {
    await sb.from('cmp_compras').update({ acrescimo }).eq('pedido_num', pedido_num);
  }

  // 5. Cria ou atualiza conta a pagar — todos os fornecedores acumulam, financeiro só no final
  const isCompExt = isCompExterna(ref?.fornecedor_nome);
  const { data: conta } = await sb.from('cmp_contas_pagar')
    .select('id,lancamento_id,adiantamento_lancamento_id,vencimento').eq('pedido_num', pedido_num).maybeSingle();

  const totalAcum = await _totalRecebComItem(pedido_num);

  if (conta) {
    await sb.from('cmp_contas_pagar').update({
      recebimento_id: receb.id, data_receb: dataRec, vencimento: venc, valor: totalAcum,
      parcelas, parcela_intervalo: parcelaInt,
    }).eq('id', conta.id);
  } else {
    await sb.from('cmp_contas_pagar').insert([{
      pedido_num, recebimento_id: receb.id,
      fornecedor: ref?.fornecedor_nome || '',
      data_receb: dataRec, vencimento: venc, valor: totalAcum, status: 'pendente',
      parcelas, parcela_intervalo: parcelaInt,
    }]);
  }

  // Se o pedido ainda está no financeiro como RASCUNHO (integração não aprovada),
  // sincroniza o valor do rascunho com o valor recebido. Sem isso, ao aprovar a
  // integração o financeiro usaria o valor ORIGINAL do pedido, ignorando a
  // divergência de peso/valor do recebimento. Update em 0 linhas se não há rascunho.
  // Parcelado: redistribui o novo total entre todos os rascunhos do pedido.
  await _sincronizarRascunhoParcelas(pedido_num, Math.max(0, totalAcum - acrescimo), acrescimo);

  // Se já existia lançamento pendente no financeiro (enviado antes do recebimento), ajusta valor automaticamente
  // Parcelado: divide o novo total entre TODAS as parcelas do pedido.
  const _financAjustado = await _sincronizarLancamentoParcelas(
    pedido_num, Math.max(0, totalAcum - acrescimo), acrescimo);

  // Vínculo perdido (ou parcelado): reaponta a conta para a 1ª parcela
  if (_financAjustado && !conta?.lancamento_id) {
    const { data: _lancFb } = await sb.from('lancamentos')
      .select('id').eq('numero_pedido', pedido_num).order('vencimento').limit(1);
    const { data: _contaFb } = await sb.from('cmp_contas_pagar')
      .select('id').eq('pedido_num', pedido_num).maybeSingle();
    if (_lancFb?.[0]?.id && _contaFb?.id) {
      await sb.from('cmp_contas_pagar').update({ lancamento_id: _lancFb[0].id }).eq('id', _contaFb.id);
    }
  }

  // Auto-finaliza quando todos os itens foram recebidos
  const { data: restantes } = await sb.from('cmp_compras')
    .select('id').eq('pedido_num', pedido_num)
    .not('status_receb', 'in', '("recebido","dispensado","cancelado")');
  if (!restantes?.length) {
    const { data: contaFinal } = await sb.from('cmp_contas_pagar')
      .select('id,adiantamento_lancamento_id,lancamento_id,vencimento,parcelas,parcela_intervalo').eq('pedido_num', pedido_num).maybeSingle();
    if (contaFinal && !contaFinal.lancamento_id) {
      if (isCompExt) {
        await _executarFinalizarCompExtMob(pedido_num, contaFinal, ref);
      } else {
        await _executarFinalizarRegularMob(pedido_num, contaFinal, ref);
      }
      toast(`✅ Pedido ${pedido_num} finalizado e enviado ao financeiro!`, 'ok');
    }
  }

  // Último preço: atualiza o custo dos ingredientes recebidos e recalcula as fichas.
  // Em segundo plano (fire-and-forget) para não atrasar a confirmação; nunca quebra o recebimento.
  _recebimentoAtualizaCustos(itensReceb);
  // Acréscimo de estoque: mercadoria recebida soma no saldo (ESTOQUE_LOJA) — reflete na tela de Saldo.
  const _porLocal = {};
  itensReceb.forEach(it => { const l = _localItem(it); (_porLocal[l] = _porLocal[l] || []).push(it); });
  Object.entries(_porLocal).forEach(([l, its]) => _recebimentoAtualizaSaldo(its, l));
  const _noP10 = (_porLocal[LOCAL_ESTOQUE_P10] || []).filter(it => it.qtd_recebida).length;

  // Recebido: a conferência destes itens já não precisa ficar guardada
  _confLimpar(itensIncluidos.map(it => it.id)).catch(e => console.error('limpar conferência:', e));
  toast(`✅ Recebimento confirmado!${temDiverg ? ' ⚠️ Com divergências.' : ''}${_noP10 ? ` 🛵 ${_noP10} ${_noP10 === 1 ? 'item' : 'itens'} no Estoque Delivery.` : ''}`, 'ok');
  setTimeout(() => {
    btn.disabled = false; btn.innerHTML = '✅ Confirmar Recebimento';
    voltarLista();
  }, 1500);
}

// ── ÚLTIMO PREÇO: custo do ingrediente atualiza no recebimento + fichas recalculam ──
function _normNome(s) {
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

// Paginação (limite de 1000 linhas do Supabase). Espelha _fetchAllPaged do desktop.
// est_ficha_ingredientes tem >1000 linhas — sem paginar, fichas cujos ingredientes
// caem após a linha 1000 calculam custo 0 e gravam isso (custo "some" no cadastro).
async function _fetchAllPagedReceb(tabela, colunas, filtro = null) {
  const PAGE = 1000;
  let todos = [], from = 0, continua = true;
  while (continua) {
    let qy = sb.from(tabela).select(colunas).range(from, from + PAGE - 1);
    if (filtro) qy = filtro(qy);
    const { data } = await qy;
    if (data && data.length) {
      todos = todos.concat(data);
      continua = data.length === PAGE;
      from += PAGE;
    } else {
      continua = false;
    }
  }
  return todos;
}

async function _recebimentoAtualizaCustos(itensReceb) {
  try {
    // Preço pago por nome de produto (normalizado)
    const precoPorNome = {};
    for (const it of itensReceb) {
      if (!it.qtd_recebida || !(it.valor_unitario > 0) || !it.produto) continue;
      precoPorNome[_normNome(it.produto)] = +it.valor_unitario;
    }
    if (!Object.keys(precoPorNome).length) return;

    // Carrega catálogo + fichas + ingredientes de uma vez — TODOS paginados (>1000 linhas)
    const [prods, fichas, ings] = await Promise.all([
      _fetchAllPagedReceb('est_produtos', 'id,nome,fator_conversao,perda,custo_comp'),
      _fetchAllPagedReceb('est_fichas_tecnicas', 'id,produto_id,rendimento', q => q.eq('ativo', true)),
      _fetchAllPagedReceb('est_ficha_ingredientes', 'ficha_id,quantidade,ingrediente_id'),
    ]);
    if (!prods?.length) return;

    const prodMap   = new Map(prods.map(p => [p.id, { ...p }]));
    const comFicha  = new Set((fichas || []).map(f => f.produto_id));
    const origCusto = new Map(prods.map(p => [p.id, p.custo_comp || 0]));

    // 1) Aplica o último preço nos ingredientes SEM ficha própria (custo de ficha vem da receita)
    for (const p of prods) {
      const preco = precoPorNome[_normNome(p.nome)];
      if (preco === undefined || comFicha.has(p.id)) continue;
      prodMap.get(p.id).custo_comp = preco;
    }

    // 2) Recalcula as fichas por passadas até estabilizar (resolve aninhamento MP → PPC → VENDA)
    const ingsPorFicha = {};
    (ings || []).forEach(i => (ingsPorFicha[i.ficha_id] ||= []).push(i));
    const calcTotal = (fichaId) => {
      let tot = 0;
      for (const ing of (ingsPorFicha[fichaId] || [])) {
        const p = prodMap.get(ing.ingrediente_id);
        if (!p) continue;
        const fator = p.fator_conversao || 1;
        const perda = p.perda || 0;
        const rend  = 1 - (perda / 100);
        tot += ing.quantidade * (rend > 0 ? ((p.custo_comp || 0) / fator) / rend : 0);
      }
      return tot;
    };
    const resultado = {};
    let mudou = true, passes = 0;
    while (mudou && passes < 12) {
      mudou = false; passes++;
      for (const f of (fichas || [])) {
        const custoTotal  = calcTotal(f.id);
        const custoPorcao = f.rendimento > 0 ? custoTotal / f.rendimento : custoTotal;
        const pm = prodMap.get(f.produto_id);
        if (pm && Math.abs((pm.custo_comp || 0) - custoPorcao) > 0.005) {
          mudou = true;
          pm.custo_comp = custoPorcao;
        }
        resultado[f.id] = { custoTotal, custoPorcao, produto_id: f.produto_id };
      }
    }

    // 3) Persiste só o que mudou — custo dos ingredientes sem ficha
    for (const p of prods) {
      if (comFicha.has(p.id)) continue;
      const novo = prodMap.get(p.id).custo_comp || 0;
      if (Math.abs((origCusto.get(p.id) || 0) - novo) <= 0.0001) continue;
      await sb.from('est_produtos').update({ custo_comp: novo }).eq('id', p.id);
    }
    // 4) Persiste só o que mudou — fichas e seus produtos
    for (const f of (fichas || [])) {
      const r = resultado[f.id];
      if (!r) continue;
      if (Math.abs((origCusto.get(r.produto_id) || 0) - r.custoPorcao) <= 0.005) continue;
      await sb.from('est_fichas_tecnicas').update({ custo_total: r.custoTotal, custo_por_porcao: r.custoPorcao }).eq('id', f.id);
      await sb.from('est_produtos').update({ custo_comp: r.custoPorcao }).eq('id', r.produto_id);
    }
  } catch (e) {
    console.error('Atualização de custo no recebimento (mobile) falhou:', e);
    // Nunca interrompe o recebimento por causa do recálculo de custo
  }
}

// ── ACRÉSCIMO DE ESTOQUE: mercadoria recebida soma no saldo (ESTOQUE_LOJA), casada por produto_id ──
// Fora da loja a caixa muda de cor e avisa o que isso significa.
// Local de Recebimento do pedido -> lugar. Estoque Central e Producao (que chega no
// Central) abrem no CENTRAL; Estoque Delivery no ESTOQUE DELIVERY (P10); o resto, na loja.
function _localRecebDoPedidoMob(setor) {
  const n = _normNome(setor || '');
  if (n === _normNome('Estoque Delivery')) return 'ESTOQUE DELIVERY';
  return (n === _normNome('Estoque Central') || n === _normNome('Produção')) ? 'CENTRAL' : 'ESTOQUE_LOJA';
}
function _pintarLocalRecebMob(doPedido = false) {
  const v      = document.getElementById('rec-local')?.value || 'ESTOQUE_LOJA';
  const box    = document.getElementById('rec-local-box');
  const hint   = document.getElementById('rec-local-hint');
  const naLoja = v === 'ESTOQUE_LOJA';
  if (box) {
    box.style.background        = naLoja ? '#0f2e1c' : '#3a1d09';
    box.style.borderBottomColor = naLoja ? '#1f6b3f' : '#b45309';
  }
  if (hint) {
    hint.textContent = naLoja
      ? 'O padrão é a loja.'
      : (doPedido ? 'Veio do pedido (Local de Recebimento). ' : '') + (v === 'ESTOQUE DELIVERY'
        ? 'Esta nota entra no Estoque Delivery do P10 — não no estoque do Centro.'
        : 'Esta nota NÃO entra no estoque da loja — vai para o Estoque Central e só chega à loja por transferência.');
    hint.style.color = naLoja ? 'var(--txt2)' : '#fbbf24';
  }
}

// O lugar vem de fora: a nota do Estoque Central e recebida la e credita o
// CENTRAL, nao o deposito da loja. Default ESTOQUE_LOJA = o que sempre foi.
async function _recebimentoAtualizaSaldo(itensReceb, local) {
  const _local = local || 'ESTOQUE_LOJA';
  try {
    // Fallback por nome só para itens sem produto_id (pedidos antigos). PAGINADO:
    // est_produtos tem >1000 linhas; sem paginar o Supabase corta em 1000 e produtos
    // além da 1ª página ficam de fora (bug real observado nos pedidos 810/811).
    const precisaNome = itensReceb.some(it => it.qtd_recebida && !it.produto_id);
    const idPorNome = {};
    const fatorPorId = {};
    if (precisaNome) {
      const prods = await _fetchAllPagedReceb('est_produtos', 'id,nome,fator_conversao');
      (prods || []).forEach(p => {
        idPorNome[_normNome(p.nome)] = p.id;
        fatorPorId[p.id] = Number(p.fator_conversao) || 1;
      });
    }

    // Casa por produto_id (vínculo por código); nome só como fallback.
    const deltaPorId = {};
    const custoPorId = {};
    for (const it of itensReceb) {
      if (!it.qtd_recebida) continue;
      const pid = it.produto_id || idPorNome[_normNome(it.produto || '')];
      if (!pid) continue;
      deltaPorId[pid] = (deltaPorId[pid] || 0) + Number(it.qtd_recebida);
      if (Number(it.valor_unitario) > 0) custoPorId[pid] = Number(it.valor_unitario);
    }
    const ids = Object.keys(deltaPorId);
    if (!ids.length) return;

    // CONVERSÃO COMPRA → USO. A nota vem na unidade de compra (ex.: 20 pacotes de 50 espetos)
    // mas o estoque e o consumo vivem na unidade de uso (espeto). Sem isto o saldo subia 20 e
    // descia 1.000. Quantidade e custo_unit mudam JUNTOS: est_movimentacoes.valor_total é
    // calculado pelo banco como quantidade x custo_unit, então multiplicar um e dividir o outro
    // mantém o valor financeiro idêntico e converte só a unidade.
    const faltaFator = ids.filter(pid => fatorPorId[pid] == null);
    if (faltaFator.length) {
      const { data: fats } = await sb.from('est_produtos')
        .select('id,fator_conversao').in('id', faltaFator);
      (fats || []).forEach(p => { fatorPorId[p.id] = Number(p.fator_conversao) || 1; });
    }
    ids.forEach(pid => {
      const f = fatorPorId[pid] || 1;
      if (f === 1) return;
      deltaPorId[pid] = deltaPorId[pid] * f;
      if (custoPorId[pid] != null) custoPorId[pid] = custoPorId[pid] / f;
    });

    const { data: saldos } = await sb.from('est_saldo_local')
      .select('produto_id,saldo').eq('local', _local).in('produto_id', ids);
    const atual = {};
    (saldos || []).forEach(s => { atual[s.produto_id] = Number(s.saldo) || 0; });

    const rows = ids.map(pid => ({
      produto_id: pid, local: _local,
      saldo: (atual[pid] || 0) + deltaPorId[pid], updated_at: new Date().toISOString()
    }));
    const { error: eUp } = await sb.from('est_saldo_local').upsert(rows, { onConflict: 'produto_id,local' });
    if (eUp) { console.error('saldo recebimento (mobile):', eUp.message); return; }

    // Livro-razão (F3): uma entrada de recebimento por produto — best-effort (nunca derruba)
    try {
      const movs = ids.filter(pid => deltaPorId[pid]).map(pid => {
        const m = { produto_id: pid, local: _local, tipo: 'recebimento', quantidade: deltaPorId[pid], origem: 'recebimento', motivo: _local === 'ESTOQUE_LOJA' ? 'Recebimento (mobile)' : _local === LOCAL_ESTOQUE_P10 ? 'Recebimento (mobile) - Estoque Delivery P10' : 'Recebimento (mobile) - Estoque Central' };
        if (custoPorId[pid] != null) m.custo_unit = custoPorId[pid];
        return m;
      });
      if (movs.length) {
        const { error: eLed } = await sb.from('est_movimentacoes').insert(movs);
        if (eLed) console.error('recebimento mobile: razão falhou (saldo OK):', eLed.message);
      }
    } catch (e) { console.error('recebimento mobile: exceção no razão (saldo OK):', e); }
  } catch (e) {
    console.error('Atualização de saldo no recebimento (mobile) falhou:', e);
    // Nunca interrompe o recebimento
  }
}

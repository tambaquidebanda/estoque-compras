name: Robô Baixa de Estoque (iComanda)

# AUTOMÁTICO desde 04/09/2026: roda todo dia pelo `schedule` abaixo.
# O botão "Run workflow" continua valendo para rodadas avulsas.
#
# Os tres modos:
#   dry    = so calcula e grava a previa. Nao encosta em nada.
#   razao  = lanca o consumo no livro-razao e NAO mexe no saldo. E o modo do
#            paralelo (08/09 a 22/09): o time continua contando e a contagem
#            continua mandando no saldo; o robo so registra o que a venda comeu,
#            para o comparativo do dia seguinte ter os dois numeros lado a lado.
#   apply  = razao + desconta o saldo de verdade. So depois de 23/09, e so se a
#            medicao dos 15 dias autorizar.
#
# BAIXA_START_DATE trava o retroativo: o robô ignora qualquer dia anterior a
# ela. Sem essa trava, ao ligar o automático ele lançaria no razão dias já
# fechados, sujando a medição antes de começar. O valor vem do secret, mas o
# workflow tem 2026-09-08 embutido como reserva — assim um secret ausente ou
# escrito errado não vira lançamento retroativo silencioso. Data, não segredo:
# está aqui à vista de propósito.
#
# Entre 05/09 e 08/09 o robô roda e não acha nada para processar (todo dia-alvo
# é anterior à trava). É de propósito: testa agendamento, secrets e permissões
# num período em que errar não custa nada. Em 09/09 de manhã ele processa o
# 08/09, o primeiro dia do paralelo.
#
# DAYS_BACK=3, e não 1, porque o `schedule` do GitHub não é garantido. Nas seis
# rodadas de 05 a 07/09 o atraso foi de 2 a 4 h e CRESCENTE (+117 min no dia 05,
# +320 min no dia 07). Atraso desse tamanho não quebra nada sozinho — a janela do
# dia é o dia de Manaus e sobram horas — mas mostra que a rodada é oferecida, não
# garantida: em carga alta o GitHub também descarta execuções agendadas. Com
# janela de 1 dia, um dia não disparado some do paralelo para sempre e a medição
# fica com buraco. Com 3, a rodada seguinte recupera sozinha o que faltou. Reprocessar é seguro: há duas travas
# independentes contra lançamento duplo — pdv_baixa_ctrl filtrado por modo e a
# existência do lançamento no razão (ja_tem_movimento), e ambas apenas pulam o
# dia. A trava de START_DATE continua valendo, então a janela maior não alcança
# dia anterior ao paralelo.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'dry (so calcula) | razao (paralelo, nao mexe no saldo) | apply (baixa de verdade)'
        required: true
        default: 'razao'
        type: choice
        options: [dry, razao, apply]
      days_back:
        description: 'Quantos dias retroativos processar'
        required: false
        default: '3'
  schedule:
    - cron: '7 5 * * *'     # 01:07 Manaus — o jantar de ontem já fechou
    - cron: '23 7 * * *'    # 03:23 Manaus
    - cron: '47 9 * * *'    # 05:47 Manaus
    - cron: '13 12 * * *'   # 08:13 Manaus — última rede, antes de a equipe chegar
    # POR QUE DE MADRUGADA (mudado em 09/09/2026, a pedido: o resultado precisa
    # estar pronto cedo para liberar produto para os setores). Medido nos dias
    # 03 a 08/09, o último caixa fechou entre 22:57 e 23:32 — depois disso não
    # falta mais nada para calcular o dia. Antes a
    # rodada era às 08:30 porque ela dependia do robô `pull-pdv` do repositório
    # do financeiro ter importado o dia (é ele que dizia de que loja era cada
    # caixa). Essa dependência morreu: agora o script pergunta a loja direto ao
    # iComanda (unidade_do_caixa). Medição que motivou tudo: em 4 dos 7 dias até
    # 08/09 o mapa do financeiro só ficou completo ao MEIO-DIA do dia seguinte —
    # rodar às 08:30 teria derrubado o dia nesses 4.
    #
    # POR QUE QUATRO TENTATIVAS, E EM MINUTO QUEBRADO. O `schedule` do GitHub é
    # oferecido, não garantido: nas rodadas de 05 a 08/09 o atraso foi de 78 a
    # 320 minutos, e a fila é pior em minuto redondo (:00 e :30). Rodar várias
    # vezes é seguro: há duas travas independentes contra lançamento duplo — o
    # controle por modo em pdv_baixa_ctrl e a existência do próprio lançamento
    # no razão (ja_tem_movimento) — e uma terceira contra lançar dia pela
    # metade: se algum caixa ainda estiver aberto o script pula o dia limpo
    # (DiaAindaAberto) e a tentativa seguinte pega.

concurrency:
  group: baixa-estoque-pdv
  cancel-in-progress: false

jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar robô de baixa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BAIXA_MODE: ${{ github.event.inputs.modo || 'razao' }}
          BAIXA_DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          BAIXA_UNIDADE_PDV: ${{ secrets.BAIXA_UNIDADE_PDV }}
          BAIXA_START_DATE: ${{ secrets.BAIXA_START_DATE || '2026-09-08' }}
        run: python scripts/baixa_estoque_pdv.py
